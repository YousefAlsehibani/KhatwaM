/* ---------- تحدي الأسبوع ---------- */
const METRICS={pages:{l:'صفحة',n:'الصفحات المقروءة'},minutes:{l:'دقيقة',n:'دقائق السماع'},
 both:{l:'نقطة',n:'مجموع الصفحات والدقائق'},days:{l:'يوم',n:'أيام تحقيق المقدار'}};
let CH_V=0;                                  /* رقم نسخة التحدي: يُبطل الكاش عند أي تعديل */
function chalTouch(){CH_V++;MEMO={}}
function chalOn(){return !!(CHALLENGE&&CHALLENGE.active)}
function chalEnded(){return chalOn()&&CHALLENGE.end<todayISO()}
function chalLive(){return chalOn()&&!chalEnded()}
function inChal(d){return d>=CHALLENGE.start&&d<=CHALLENGE.end}
function chalProgress(code){if(!chalOn())return 0;const r=CHAL_BOARD.find(x=>x.public_code===code);
 return r?+r.progress:memo('ch'+CH_V+'|'+code,()=>_chal(code))}
function _chal(code){
 const st=studentByCode(code),es=entriesOf(code).filter(e=>inChal(e.date));
 if(CHALLENGE.metric==='pages')return sum(es,'pages');
 if(CHALLENGE.metric==='minutes')return sum(es,'minutes');
 if(CHALLENGE.metric==='both')return sum(es,'pages')+sum(es,'minutes');
 return eachDay(CHALLENGE.start,CHALLENGE.end<todayISO()?CHALLENGE.end:todayISO())
  .filter(d=>metGoal(st,d)).length}
function eachDay(a,b){const out=[];if(!a||!b||b<a)return out;
 let d=new Date(a+'T00:00Z');const e=new Date(b+'T00:00Z');
 while(d<=e){out.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1)}return out}
function chalDaysLeft(){return eachDay(todayISO(),CHALLENGE.end).length}
function chalRank(code){const v=chalProgress(code);
 const r=CHAL_BOARD.find(x=>x.public_code===code);return r?+r.rank:
  1+STUDENTS.reduce((n,x)=>n+(chalProgress(x.code)>v?1:0),0)}
function chalWinners(list){if(CHAL_BOARD.length&&list===STUDENTS)return CHAL_BOARD
 .filter(x=>+x.progress>=CHALLENGE.target).map(x=>studentByCode(x.public_code)).filter(Boolean);
 return list.filter(s=>chalProgress(s.code)>=CHALLENGE.target)}

function addDays(iso,n){const d=new Date(iso+'T00:00Z');d.setUTCDate(d.getUTCDate()+n);
 return d.toISOString().slice(0,10)}

/* ==================== الوثبة ==================== */
const RAFFLE_BONUS=3;
const wState=w=>{const n=Date.now();return n<w.opens?'soon':n<w.closes?'open':'closed'};
const wUnit=w=>w.type==='read'?'صفحة':'دقيقة';
const wDoneBy=(id,code)=>WDONE.find(x=>x.w===id&&x.code===code);
const WEEK=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
/* موعد مقروء بتوقيت الرياض مهما كان توقيت جهاز القارئ */
function fmtWhen(ms){const d=new Date(ms+TZ*3600000),h=d.getUTCHours(),m=d.getUTCMinutes();
 const today=todayISO(),iso=new Date(ms+TZ*3600000-DAY_START*3600000).toISOString().slice(0,10);
 const day=iso===today?'اليوم':iso===addDays(today,1)?'غدًا':WEEK[d.getUTCDay()];
 const h12=h%12||12,per=h<12?'صباحًا':h<17?'ظهرًا':'مساءً';
 return day+' '+h12+(m?':'+String(m).padStart(2,'0'):'')+' '+per}
function studentWathba(){
 const byOpen=(a,b)=>a.opens-b.opens,me=S.me.code;
 const open=WATHBAS.filter(w=>wState(w)==='open').sort((a,b)=>a.closes-b.closes);
 const todo=open.find(w=>!wDoneBy(w.id,me));if(todo)return todo;
 const soon=WATHBAS.filter(w=>wState(w)==='soon').sort(byOpen)[0];if(soon)return soon;
 return open[0]||WATHBAS.find(w=>wDoneBy(w.id,me)&&Date.now()-w.closes<20*36e5)||null}
function ticketsOf(code){
 if(!chalOn())return{w:0,bonus:0,total:0};
 const w=WDONE.filter(x=>x.code===code&&x.day>=CHALLENGE.start&&x.day<=CHALLENGE.end).length;
 const bonus=chalProgress(code)>=CHALLENGE.target?RAFFLE_BONUS:0;
 return{w,bonus,total:w+bonus}}

/* ── العدّاد: مؤقّت واحد لكل الصفحة، يلمس الأرقام المتغيّرة فقط، ويتوقف إذا خفيت الصفحة ── */
let TICKER=null;
const CLK_UNITS=[['d','يوم'],['h','ساعة'],['m','دقيقة'],['s','ثانية']];
function splitMs(ms){const t=Math.max(0,Math.floor(ms/1000));
 return{d:Math.floor(t/86400),h:Math.floor(t%86400/3600),m:Math.floor(t%3600/60),s:t%60}}
function clockHTML(until,compact){const v=splitMs(until-Date.now());
 return `<span class="clk ${compact?'mini':''} ${v.d?'':'nod'}" data-until="${until}" role="timer" aria-live="off">${CLK_UNITS.map(([k,l])=>{
  const s=String(Math.min(99,v[k])).padStart(2,'0');
  return `<span class="cu cu-${k}"><span class="cd"><b class="dg">${s[0]}</b><b class="dg">${s[1]}</b></span><i>${l}</i></span>`}).join('')}</span>`}
function paintClock(el,ms){const v=splitMs(ms);el.classList.toggle('nod',!v.d);
 for(const [k] of CLK_UNITS){const ds=el.querySelectorAll('.cu-'+k+' .dg'),s=String(Math.min(99,v[k])).padStart(2,'0');
  for(let i=0;i<2;i++){const d=ds[i];if(!d||d.textContent===s[i])continue;d.textContent=s[i];
   /* تبديل بين صنفين متطابقين يعيد تشغيل الحركة بلا إجبار المتصفح على إعادة التخطيط */
   if(!reduced)d.className='dg '+(d.classList.contains('fa')?'fb':'fa')}}}
function tick(){
 const nodes=document.querySelectorAll('[data-until]');
 if(!nodes.length){clearInterval(TICKER);TICKER=null;return}
 if(document.hidden)return;
 const now=Date.now();let crossed=false;
 nodes.forEach(el=>{const left=+el.dataset.until-now;left<=0?crossed=true:paintClock(el,left)});
 if(crossed){clearInterval(TICKER);TICKER=null;
  /* نزلت الوثبة أو أُقفلت: المادة محجوبة حتى الموعد، فنجلبها الآن */
  refreshState()}}
function startTicker(){if(!TICKER&&document.querySelector('[data-until]')){TICKER=setInterval(tick,1000)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.role){tick();startTicker()}});

/* لحظة الإنجاز: النقطة تقفز فوق الدرجات، ثم تتناثر قصاصات. تُحلّ بعد الهبوط لنعيد الرسم. */
function celebrate(card){return new Promise(res=>{
 if(!card||reduced)return res();
 card.classList.add('leaping');
 setTimeout(()=>{burst(card.querySelector('.wart')||card,26)},560);
 setTimeout(res,1150)})}
function burst(host,n){const box=document.createElement('span');box.className='burst';
 const cols=['#E7C463','#6FD3C4','#fff','#C08A1E','#3FA394'];
 for(let k=0;k<n;k++){const p=document.createElement('i'),a=(Math.PI*2*k/n)+(Math.random()-.5)*.5,r=46+Math.random()*58;
  p.style.cssText=`--x:${(Math.cos(a)*r).toFixed(1)}px;--y:${(Math.sin(a)*r-18).toFixed(1)}px;`+
   `--r:${Math.round(Math.random()*540-270)}deg;background:${cols[k%cols.length]};animation-delay:${(Math.random()*70)|0}ms`;
  box.appendChild(p)}
 host.appendChild(box);setTimeout(()=>box.remove(),1300)}
async function doWathba(id,btn){
 if(btn.dataset.busy)return;
 const b=(WDRAFT[id]||'').trim();if(b.length<8)return toast('اكتب فائدة خرجت بها — سطر قصير يكفي.');
 btn.dataset.busy='1';btn.classList.add('loading');
 try{const {data,error}=await SB.rpc('complete_wathba',{p_wathba:id,p_benefit:b});if(error)throw error;
  await celebrate(btn.closest('.wcard'));
  delete WDRAFT[id];applyState(data.state);toast(data.message||'وثبت!')
 }catch(e){btn.removeAttribute('data-busy');btn.classList.remove('loading');toast(e.message||'تعذّر الحفظ.')}}

/* ── السحب: اختيار مرجّح بعدد البطاقات، بعشوائية التشفير لا Math.random ── */
function raffleRows(){return STUDENTS.map(s=>({s,...ticketsOf(s.code)})).filter(r=>r.total>0)
 .sort((a,b)=>b.total-a.total||a.s.name.localeCompare(b.s.name,'ar'))}
function pickWeighted(rows){const tot=rows.reduce((t,r)=>t+r.total,0);if(!tot)return null;
 const a=new Uint32Array(1);crypto.getRandomValues(a);let x=a[0]/4294967296*tot;
 for(const r of rows){if((x-=r.total)<0)return r}return rows[rows.length-1]}
function raffleCard(i){
 if(!chalOn())return '';
 const rows=raffleRows(),tot=rows.reduce((t,r)=>t+r.total,0);
 return `<div class="card stagger rafcard" style="--i:${i};margin-top:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
   <div><p class="eyebrow">كل وثبة بطاقة · إتمام التحدي +${RAFFLE_BONUS}</p><h2>السحب</h2></div>
   ${S.role==='admin'&&rows.length?'<button class="btn sm rafgo" onclick="startDraw()">ابدأ السحب</button>':''}</div>
  ${rows.length?`<div class="rafgrid">${rows.map(r=>`<div class="rafrow">
    <span class="rn">${esc(r.s.name)}</span>
    <span class="tix">${[...Array(Math.min(r.total,12))].map((_,k)=>`<i style="--t:${k}"></i>`).join('')}</span>
    <span class="rv num">${r.total}</span>
    <span class="rp num">${Math.round(r.total/tot*100)}%</span></div>`).join('')}</div>`
   :'<div class="empty">ما فيه بطاقات بعد — تنزل مع أول وثبة.</div>'}</div>`}
function chalTab(){return chalView()+wathbaPanel(8)+raffleCard(10)}
let DRAW=null;
function startDraw(exclude){
 const rows=raffleRows().filter(r=>!(exclude||[]).includes(r.s.code));
 if(!rows.length)return toast('لا يوجد مشاركون متبقّون.');
 const win=pickWeighted(rows),names=rows.map(r=>r.s.name);
 DRAW={win,exclude:[...(exclude||[]),win.s.code]};
 const root=document.getElementById('modalRoot');
 root.innerHTML=`<div class="drawov" role="dialog" aria-modal="true" aria-label="السحب">
  <div class="drawbox"><p class="drawk">${esc(CHALLENGE.title||'تحدي الأسبوع')}</p>
   <div class="slot"><span class="slotname" id="slotname">…</span></div>
   <p class="drawsub" id="drawsub">يجري السحب بين <b class="num">${rows.length}</b> مشاركًا</p>
   <div class="drawact" id="drawact"></div></div></div>`;
 const el=document.getElementById('slotname'),token=DRAW;
 /* تباطؤ تدريجي: الفاصل يكبر تربيعيًا حتى يستقر على الفائز.
    token يوقف الحلقة لو أُغلق السحب أو بدأ سحب جديد أثناء الدوران. */
 const frames=reduced?1:30;let k=0;
 const step=()=>{if(DRAW!==token||!el.isConnected)return;k++;
  const last=k>=frames,name=last?win.s.name:names[(Math.random()*names.length)|0];
  el.textContent=name;if(!reduced)el.className='slotname '+(k%2?'sa':'sb');
  if(!last)return setTimeout(step,40+k*k*0.55);
  el.className='slotname win';
  document.getElementById('drawsub').innerHTML=`<b>الفائز</b> · <span class="num">${win.total}</span> ${win.total===1?'بطاقة':'بطاقات'}`;
  document.getElementById('drawact').innerHTML=`<button class="btn outline" onclick="startDraw(DRAW.exclude)">سحب فائز آخر</button>
   <button class="btn" onclick="endDraw()">إغلاق</button>`;
  burst(document.querySelector('.slot'),34)};
 step()}
function endDraw(){DRAW=null;const o=document.querySelector('.drawov');
 if(o&&!reduced){o.classList.add('out');setTimeout(renderModal,260)}else renderModal()}

     ✓ أنت في الانتظار — ترتيبك <b class="num">${pos}</b>. نخبرك أول ما تتحرر نسخة.</p>`
    :`<p style="font-size:12.5px;color:var(--muted);margin-top:14px">
      سجّل اسمك في الانتظار، وأول ما يُنهي أحدهم الكتاب تُخصَّص لك نسخته. وتقدر تبدأ بغيره الآن.</p>`}
   <div class="row">
    ${pos?`<button class="btn outline" onclick="leaveWait('${m.id}');closeModal()">اخرج من الانتظار</button>`
      :`<button class="btn" onclick="joinWait('${m.id}')">سجّلني في الانتظار</button>`}
    <button class="btn outline" onclick="closeModal()">${pos?'إغلاق':'أختار غيره'}</button></div>`}
 if(m.t==='move'){const st=studentByCode(m.code);
  b=`<h3>نقل ${esc(st.name)}</h3><p class="sub">حاليًا في ${esc(st.group)} — اختر المجموعة الجديدة.</p>
   <div class="grouppick">${SUPERVISORS.map(v=>`<button class="gpick ${v.code===st.supervisor?'cur':''}"
     onclick="moveStudent('${st.code}','${v.code}')">
     <b>${esc(v.group)}</b><span class="chip">${esc(v.name)} · ${STUDENTS.filter(x=>x.supervisor===v.code).length} طلاب</span>
     ${v.code===st.supervisor?'<span class="pill ok">مجموعته الآن</span>':'<span style="color:var(--teal)">←</span>'}</button>`).join('')}</div>
   <div class="row"><button class="btn outline" onclick="closeModal()">إلغاء</button></div>`}
 if(m.t==='wathba')b=wathbaForm(m);
 if(m.t==='benefits')b=benefitsModal(m);
 if(m.t==='rename'){const v=SUPERVISORS.find(x=>x.code===m.sup);
  b=`<h3>تعديل المجموعة</h3><p class="sub">مشرفها: ${esc(v.name)} · ${STUDENTS.filter(x=>x.supervisor===v.code).length} طلاب</p>
   <label for="gname">اسم المجموعة</label><input id="gname" type="text" value="${esc(v.group)}">
   <div class="row"><button class="btn outline" onclick="closeModal()">إلغاء</button>
   <button class="btn" onclick="renameGroup('${v.code}')">حفظ</button></div>`}
 return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${b}</div></div>`;
}

 while(studentByCode(c)||SUPERVISORS.find(s=>s.code===c)||OBSERVERS.find(s=>s.code===c)||c===ADMIN.code);return c}

/* ── رسّام موحّد: يشتغل على القسم الظاهر فقط ── */
function cellInfo(el,box){const b=document.getElementById(box);if(!b)return;
 b.textContent=el.dataset.inf;b.classList.remove('lit');void b.offsetWidth;b.classList.add('lit')}
function paintWithin(root,anim){
 root.querySelectorAll('[data-w]').forEach((el,i)=>{
  const w=el.dataset.w+'%'; anim?setTimeout(()=>el.style.width=w,60+i*35):el.style.width=w});
 root.querySelectorAll('[data-off]').forEach(el=>{
  const o=el.dataset.off; anim?setTimeout(()=>el.style.strokeDashoffset=o,110):el.style.strokeDashoffset=o});
 root.querySelectorAll('[data-seg]').forEach(el=>{
  const g=el.dataset.seg; anim?setTimeout(()=>el.setAttribute('stroke-dasharray',g),150):el.setAttribute('stroke-dasharray',g)});
 root.querySelectorAll('[data-to]').forEach(el=>anim&&!reduced?countEl(el)
   :el.textContent=el.dataset.to+(el.dataset.suffix||''))}
function countEl(el){if(el._c)return;el._c=1;
 const to=+el.dataset.to,sfx=el.dataset.suffix||'',dur=to>200?1100:820,t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
  el.textContent=Math.round(to*e)+sfx;if(k<1)requestAnimationFrame(step)};
 setTimeout(()=>requestAnimationFrame(step),120)}
let IO=null;
function observeReveals(anim){
 if(IO){IO.disconnect();IO=null}
 const nodes=[...document.querySelectorAll('main .stagger')];
 if(!anim||reduced){nodes.forEach(n=>n.classList.add('in'));paintWithin(document,false);return}
 IO=new IntersectionObserver(es=>{es.forEach(x=>{if(!x.isIntersecting)return;
   x.target.classList.add('in');paintWithin(x.target,true);IO.unobserve(x.target)})},
  {rootMargin:'40px 0px -6% 0px',threshold:.04});
 nodes.forEach(n=>IO.observe(n));
 setTimeout(()=>paintWithin(document,false),2200)}
function renderModal(){document.getElementById('modalRoot').innerHTML=modalHTML();
 const f=document.querySelector('.modal input,.modal select');f&&f.focus()}
function toast(msg){const r=document.getElementById('toastRoot');
 r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast._t);
 toast._t=setTimeout(()=>r.innerHTML='',2400)}

let lastKey='';

function renderShell(){
 if(!S.role){drawLogin();return}
 const key=[S.role,S.view,S.field,S.student].join('|'), anim=key!==lastKey; lastKey=key;
 let main='';
 if(S.role==='student')main=tabs([{id:'today',label:'اليوم'},{id:'log',label:'سجل إنجازي'},{id:'board',label:'المتصدرون'}])
   +(S.view==='field'?fieldView():S.view==='log'?logView():S.view==='board'?boardView():todayView());
 if(S.role==='supervisor')main=tabs([{id:'students',label:'طلابي'},{id:'shelves',label:'الرفوف'},{id:'board',label:'المتصدرون'}])
   +(S.student?detailView():S.view==='shelves'?shelvesView():S.view==='board'?boardView():studentsView());
 if(S.role==='admin')main=tabs([{id:'students',label:'الطلاب'},{id:'chal',label:'التحدي والوثبات'},{id:'loans',label:'العهدة'},{id:'shelves',label:'الرفوف'},{id:'people',label:'المجموعات'},{id:'courses',label:'المقررات'},{id:'board',label:'المتصدرون'}])
   +(S.student?detailView():S.view==='chal'?chalTab():S.view==='loans'?loansView():S.view==='shelves'?shelvesView():S.view==='people'?peopleView():S.view==='courses'?coursesView():S.view==='board'?boardView():studentsView());
 if(S.role==='observer')main=tabs([{id:'students',label:'الطلاب'},{id:'chal',label:'التحدي والوثبات'},{id:'loans',label:'العهدة'},{id:'shelves',label:'الرفوف'},{id:'people',label:'المجموعات'},{id:'courses',label:'المقررات'},{id:'board',label:'المتصدرون'}])
   +readOnlyNotice()
   +(S.student?detailView():S.view==='chal'?chalTab():S.view==='loans'?loansView():S.view==='shelves'?shelvesView():S.view==='people'?peopleView():S.view==='courses'?coursesView():S.view==='board'?boardView():studentsView());
 shell().innerHTML=topbar()+`<main class="wrap ${anim?'anim':''}" style="padding-bottom:70px">${main}</main>`;
 requestAnimationFrame(()=>{moveTabInd();observeReveals(anim);startTicker()});
}
function moveTabInd(){const t=$('#tabs');if(!t)return;const a=t.querySelector('[aria-selected="true"]'),ind=$('#tabInd');
 if(!a||!ind)return;ind.style.width=a.offsetWidth+'px';
 ind.style.right=(t.scrollWidth-a.offsetLeft-a.offsetWidth)+'px';}



let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(moveTabInd,120)},{passive:true});
/* موجة ضغط على كل الأزرار */
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.btn,.startbtn,.filter,.movebtn');if(!b||reduced)return;
 const r=b.getBoundingClientRect(),d=document.createElement('span');
 d.className='ripple';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
 d.style.width=d.style.height='18px';
 d.style.background=b.classList.contains('btn')&&!b.classList.contains('outline')?'rgba(255,255,255,.35)':'rgba(11,92,85,.18)';
 b.appendChild(d);setTimeout(()=>d.remove(),560)},{passive:true});
document.addEventListener('keydown',e=>{
 if(!S.role){if(/^[0-9]$/.test(e.key))tap(null,e.key);
  else if(e.key==='Backspace')tap(null,'back');else if(e.key==='Enter')login();return}
 if(e.key==='Escape')closeModal()});
initRemote();
