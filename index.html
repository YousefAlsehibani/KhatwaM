<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطوة · المتوسط — مقرر الأسبوع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://benqmepnybminxeyubqn.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Zain:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3ED; --bg-soft:#FAF9F5; --surface:#FFFEFC; --card:#FFFEFC;
  --ink:#102F28; --ink2:#34544B; --muted:#71857E;
  --line:#E3E4DA; --line-strong:#D5D8CB;
  --teal:#164F42; --teal2:#27715E; --teal3:#6E9E8F; --teal-soft:#E8F1ED;
  --gold:#AF8A43; --gold-soft:#F5EEDC;
  --danger:#A95A52; --danger-soft:#F8ECEA;
  --brand:#164F42; --brand2:#27715E; --brand-soft:#E8F1ED;
  --amber:#AF8A43; --amber-soft:#F5EEDC; --rose:#A95A52; --green:#27715E;
  --g1:#164F42; --g2:#27715E; --g3:#AF8A43;
  --r:20px;
  --s1:0 1px 2px rgba(22,79,66,.05);
  --s2:0 3px 8px rgba(22,79,66,.06), 0 18px 40px -30px rgba(22,79,66,.45);
  --s3:0 30px 64px -34px rgba(22,79,66,.5);
  --e:cubic-bezier(.22,.9,.25,1); --sp:cubic-bezier(.2,1.1,.4,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
 font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Zain",sans-serif;font-weight:800;line-height:1.25;margin:0}
h1{font-size:clamp(34px,7vw,52px)}
h2{font-size:clamp(21px,3vw,27px)}
h3{font-size:19px;font-weight:700}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.eyebrow{font-size:11.5px;color:var(--muted);margin:0 0 5px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.spacer{flex:1}

/* ===== حركة ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes popin{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-6px)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.09)}}
@keyframes sheen{from{background-position:220% 0}to{background-position:-120% 0}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}
@keyframes ringpulse{0%{transform:scale(.65);opacity:.5}100%{transform:scale(2);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
main.anim{animation:fadein .4s var(--e) both}
.anim .rv{opacity:0}
.anim .rv.in{animation:rise .6s var(--e) both;animation-delay:calc(var(--i,0)*55ms)}

/* ===== شريط علوي ===== */
.top{position:sticky;top:0;z-index:30;color:#F2F1EA;
 background:linear-gradient(112deg,#111A2E 0%,#164F42 55%,#20336B 100%);animation:drop .5s var(--e) both}
.top .wrap{display:flex;align-items:center;gap:13px;height:62px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Zain",sans-serif;font-weight:900;font-size:23px}
.brand svg{width:26px;height:26px}
.who{font-size:12.5px;color:#9CB2A9;text-align:left;line-height:1.35}
.who b{display:block;color:#fff;font-weight:600;font-size:14px}
.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#CFD9EC;
 padding:7px 14px;border-radius:999px;font-size:13px;transition:.25s var(--e)}
.ghost:hover{background:rgba(255,255,255,.16);color:#fff}

/* ===== تبويبات ===== */
.tabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--line);margin:24px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:11px 16px;color:var(--muted);font-size:15px;white-space:nowrap;transition:color .25s}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button:hover{color:var(--ink2)}
.tind{position:absolute;bottom:-1px;height:2.5px;background:var(--brand);border-radius:2px;
 transition:right .45s var(--sp),width .45s var(--sp)}

/* ===== بطاقات ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:21px;box-shadow:var(--s1);
 transition:box-shadow .35s var(--e),transform .35s var(--e)}
.card:hover{box-shadow:var(--s2)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 13px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:#DFF3EE;color:var(--green)}
.pill.mid{background:var(--amber-soft);color:#8A5A10}
.pill.off{background:#FAE7EC;color:var(--rose)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ===== أزرار ===== */
.btn{position:relative;overflow:hidden;background:var(--brand);color:#fff;border:0;border-radius:13px;
 padding:14px 22px;font-size:15.5px;font-weight:600;width:100%;transition:.25s var(--e);
 box-shadow:0 12px 26px -14px var(--brand);font-family:"Zain",sans-serif}
.btn:hover{background:var(--brand2);transform:translateY(-2px)}
.btn:active{transform:scale(.985)}
.btn.sm{width:auto;padding:9px 17px;font-size:13.5px;border-radius:11px}
.btn.outline{background:transparent;color:var(--brand);border:1.5px solid #B9C5F3;box-shadow:none}
.btn.outline:hover{background:var(--brand-soft)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
 transform:translate(-50%,-50%) scale(0);animation:rip .55s var(--e) forwards;pointer-events:none}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:30px;height:28px;
 color:var(--muted);font-size:13px;transition:.25s var(--e);padding:0 9px}
.qbtn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.qbtn.del:hover{border-color:var(--rose);color:var(--rose)}

/* ===== دخول ===== */
.login{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;animation:drift 17s ease-in-out infinite}
.b1{width:440px;height:440px;background:#C3CFF7;top:-150px;right:-110px}
.b2{width:360px;height:360px;background:#F6DFBC;bottom:-120px;left:-90px;animation-delay:-6s}
.lcard{position:relative;width:100%;max-width:390px;text-align:center}
.lcard>*{animation:rise .7s var(--e) both}
.lcard>*:nth-child(1){animation-delay:.05s}.lcard>*:nth-child(2){animation-delay:.13s}
.lcard>*:nth-child(3){animation-delay:.2s}.lcard>*:nth-child(4){animation-delay:.27s}
.lcard>*:nth-child(5){animation-delay:.34s}.lcard>*:nth-child(6){animation-delay:.4s}
.lcard>*:nth-child(7){animation-delay:.46s}
.logo{width:72px;height:72px;margin:0 auto;display:block}
.logo path,.logo circle{animation:popin .6s var(--sp) both}
.logo path:nth-child(2){animation-delay:.16s}.logo circle{animation-delay:.3s}
.login h1{margin:12px 0 0}
.brandsub{font-family:"Zain",sans-serif;font-weight:600;font-size:15px;color:var(--brand);
 letter-spacing:.32em;margin:0 0 12px;padding-right:.32em}
.bwrap{display:flex;flex-direction:column;line-height:1}
.bwrap em{font-style:normal;font-family:"IBM Plex Sans Arabic";font-size:10.5px;font-weight:400;
 color:#9CB2A9;letter-spacing:.3em;margin-top:2px;padding-right:.3em}
/* الفوائد */
.bens{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.ben{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);padding:19px 19px 15px;box-shadow:var(--s1);
 transition:transform .42s var(--sp),box-shadow .42s var(--e),border-color .3s}
.ben:hover{transform:translateY(-4px);box-shadow:var(--s2)}
.ben::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gc);
 transform:scaleY(.35);transform-origin:center;transition:transform .45s var(--sp)}
.ben:hover::before{transform:scaleY(1)}
.quote{position:absolute;top:-16px;left:14px;font-family:"Zain",sans-serif;font-size:76px;font-weight:900;
 color:var(--gc);opacity:.1;pointer-events:none;line-height:1}
.rv.in .quote{animation:popin .6s var(--sp) both;animation-delay:.15s}
.btxt{margin:0;font-size:14.5px;line-height:2;color:var(--ink)}
.bfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;
 padding-top:12px;border-top:1px solid var(--line)}
.bmeta{display:flex;align-items:center;gap:9px;min-width:0}
.bn{min-width:0}
.bn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn span{font-size:11.5px;color:var(--muted)}
.bact{display:flex;align-items:center;gap:7px;flex:none}
.star{border:0;background:transparent;font-size:21px;line-height:1;color:#C3CBD9;padding:2px 4px;
 transition:.3s var(--sp)}
.star:hover{color:var(--amber);transform:scale(1.25) rotate(12deg)}
.star.on{color:var(--amber);animation:starpop .5s var(--sp)}
@keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(18deg)}100%{transform:scale(1)}}
.ben.picked{border-color:#EBD5A8;background:linear-gradient(150deg,#FDF7EA,var(--surface) 62%)}
.ben.picked::before{background:var(--amber);transform:scaleY(1)}
.ribbon{position:absolute;top:12px;left:12px;background:var(--amber);color:#fff;font-size:10.5px;
 font-weight:700;border-radius:999px;padding:3px 11px;animation:popin .5s var(--sp)}
.ben.big{padding:26px 24px 18px}
.ben.big .btxt{font-size:16.5px;line-height:2.1;font-family:"Zain",sans-serif;font-weight:400}
.ben.big .quote{font-size:110px;top:-26px}
.pickbar{display:flex;align-items:center;gap:14px;border-radius:16px;padding:14px 17px;margin-bottom:15px;
 background:linear-gradient(120deg,#FBF0DC,var(--surface) 70%);border:1.5px solid #EFDCB6}
.pickbar .si{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;
 font-size:19px;color:var(--amber);flex:none;box-shadow:var(--s1)}
.pickbar b{font-family:"Zain",sans-serif;font-size:15px;font-weight:700;display:block}
.pickbar p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.bhint{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;
 color:var(--muted);margin-top:7px}
.logben{margin:9px 0 0;font-size:13px;line-height:1.9;color:var(--muted);
 padding-right:12px;border-right:2px solid var(--line);display:flex;gap:8px;align-items:baseline}

.login .sub{color:var(--muted);margin:0 0 24px;font-size:14.5px}
.codes{display:flex;gap:10px;justify-content:center;direction:ltr}
.dg{width:60px;height:70px;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);
 display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;
 transition:.3s var(--sp);box-shadow:var(--s1)}
.dg.f{border-color:var(--brand);color:var(--brand);transform:translateY(-3px);box-shadow:0 9px 20px -10px var(--brand)}
.dg.a{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.dg span{animation:popin .3s var(--sp)}
.codes.bad{animation:shake .45s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.pad button{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;
 padding:15px 0;font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--ink);transition:.22s var(--e);box-shadow:var(--s1)}
.pad button:hover{background:var(--brand-soft);border-color:#B9C5F3;transform:translateY(-2px)}
.pad button:active{transform:scale(.94)}
.err{color:var(--rose);font-size:13.5px;min-height:22px;margin-top:11px}
.hint{margin-top:20px;font-size:12.5px;color:var(--muted);line-height:2.1}
.hint code{font-family:"IBM Plex Mono",monospace;background:var(--brand-soft);color:var(--brand);
 padding:3px 8px;border-radius:7px;cursor:pointer;transition:.2s}
.hint code:hover{background:var(--brand);color:#fff}
.leaving{animation:fadeout .45s var(--e) forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(-14px) scale(.97)}}

/* ===== لوحة أسبوعية ===== */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 26px;color:#F2F1EA;
 background:linear-gradient(118deg,#111A2E 0%,#1C2B4E 56%,#233A79 100%);box-shadow:0 26px 50px -32px rgba(17,26,46,.85)}
.hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;top:-200px;left:-80px;
 background:radial-gradient(circle,rgba(224,138,30,.35),transparent 62%);animation:drift 16s ease-in-out infinite;pointer-events:none}
.hero::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;bottom:-190px;right:-70px;
 background:radial-gradient(circle,rgba(71,99,240,.5),transparent 62%);animation:drift 21s ease-in-out -7s infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hlab{font-size:12.5px;color:#9CB2A9;margin:0 0 3px}
.hero h2{color:#fff}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hst{display:flex;gap:24px;flex-wrap:wrap}
.hst .hv{font-family:"IBM Plex Mono",monospace;font-size:31px;font-weight:600;color:#fff;line-height:1.15}
.hst .hv small{font-family:"IBM Plex Sans Arabic";font-size:12px;color:#9CB2A9;font-weight:400}
.hst .hk{font-size:11.5px;color:#9CB2A9}
.hv.am{color:#F3B košt}
.hv.am{color:#D9B872}.hv.gr{color:#95C6B5}

/* مسار الأسبوع */
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:18px}
.day{position:relative;border-radius:12px;background:rgba(255,255,255,.09);padding:9px 4px 8px;text-align:center;
 transition:transform .3s var(--sp);cursor:pointer}
.day:hover{transform:translateY(-3px)}
.day.today{box-shadow:0 0 0 2px #D9B872}
.day .dn{font-size:10.5px;color:#9CB2A9}
.day .dv{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#fff;font-weight:600;margin-top:3px}
.day .fill{height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin-top:7px;overflow:hidden}
.day .fill i{display:block;height:100%;width:0;background:#95C6B5;border-radius:99px;transition:width .9s var(--e)}
.day.miss .dv{color:#7E948B}

/* مقرر الأسبوع */
.wc{position:relative;overflow:hidden;display:flex;gap:17px;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);padding:19px;box-shadow:var(--s1);transition:transform .42s var(--sp),box-shadow .42s var(--e)}
.wc:hover{transform:translateY(-4px);box-shadow:var(--s2)}
.wc::after{content:"";position:absolute;inset:0;background:radial-gradient(85% 70% at 100% 0,var(--c),transparent 62%);opacity:.06;pointer-events:none}
.cov{width:88px;flex:none}
.cov svg{width:88px;height:118px;display:block;filter:drop-shadow(0 12px 20px rgba(17,26,46,.2))}
.cov .fb{transition:height 1.1s var(--e),y 1.1s var(--e)}
.wcb{flex:1;min-width:0;display:flex;flex-direction:column}
.kick{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--c);font-weight:700}
.wcb h3{margin:5px 0 1px;font-size:20px}
.wcb .by{color:var(--muted);font-size:12.5px;margin:0}
.note{margin:8px 0 0;font-size:12px;line-height:1.75;color:var(--muted);cursor:pointer;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.note.open{-webkit-line-clamp:99;display:block}
.golink{display:inline-flex;align-items:center;gap:9px;margin-top:11px;text-decoration:none;
 background:linear-gradient(120deg,var(--brand-soft),#F4F6FE);border:1.5px solid #C9D4F8;color:var(--brand);
 border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:600;font-family:"Zain",sans-serif;
 transition:.3s var(--e);align-self:flex-start}
.golink:hover{background:var(--brand);color:#fff;border-color:var(--brand);transform:translateY(-2px);
 box-shadow:0 12px 24px -14px var(--brand)}
.golink .pl{width:24px;height:24px;border-radius:8px;background:var(--brand);display:grid;place-items:center;
 flex:none;transition:.3s var(--e)}
.golink .pl svg{width:13px;height:13px;fill:#fff}
.golink:hover .pl{background:rgba(255,255,255,.22);transform:scale(1.08)}
.golink .arw{font-size:12px;transition:transform .3s var(--sp)}
.golink:hover .arw{transform:translate(-3px,-3px)}
.golink.sm{margin:12px 0 0;padding:8px 12px;font-size:13px;width:100%;justify-content:center}
.nolink{margin:11px 0 0;font-size:12px;color:var(--rose)}
.prog{margin-top:auto;padding-top:14px}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.prow b{font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--c)}
.bar{height:9px;background:#E7EBF2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--brand);transition:width 1s var(--e)}

/* اقتراح اليوم */
.sug{display:flex;align-items:center;gap:14px;border-radius:16px;padding:15px 17px;margin-top:14px;
 background:linear-gradient(120deg,var(--brand-soft),var(--surface) 70%);border:1.5px solid #C9D4F8}
.sug.late{background:linear-gradient(120deg,#FBEDD9,var(--surface) 70%);border-color:#EFD9B4}
.sug.done{background:linear-gradient(120deg,#DFF3EE,var(--surface) 70%);border-color:#B6E2D6}
.sug .si{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:var(--s1)}
.sug b{font-family:"Zain",sans-serif;font-size:15.5px;font-weight:700;display:block}
.sug p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}

/* حلقة */
.ringbox{position:relative;width:150px;height:150px;flex:none}
.ring{width:150px;height:150px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .tr{stroke:#E7EBF2}
.ring .arc{transition:stroke-dashoffset 1.2s var(--e)}
.rmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rmid b{font-family:"IBM Plex Mono",monospace;font-size:31px;font-weight:600;line-height:1}
.rmid span{font-size:11px;color:var(--muted)}
.pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);animation:ringpulse 2.6s var(--e) infinite;pointer-events:none}

/* تسجيلات اليوم */
.tlog{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:11px 14px;
 background:#F6F8FC;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.tlh span{font-size:11px;font-weight:400;color:var(--muted)}
.tent{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid #F0F3F8;font-size:13.5px}
.tent:last-child{border-bottom:0}
.tent .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tent .vv{color:var(--muted);font-size:12.5px}

/* مصفوفة */
.mwrap{overflow-x:auto;padding-bottom:6px}
.matrix{min-width:560px;display:grid;grid-template-columns:150px repeat(7,1fr);gap:5px;align-items:center}
.mh{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:5px}
.mh.now{color:var(--amber);font-weight:700}
.mn{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.mn .av{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;
 font-family:"Zain",sans-serif;font-weight:800;font-size:12.5px;background:linear-gradient(145deg,var(--gc),#164F42)}
.mn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mc{width:100%;aspect-ratio:1;max-height:30px;border-radius:7px;background:#E7EBF2;cursor:pointer;
 transition:transform .22s var(--sp)}
.mc:hover{transform:scale(1.35);z-index:3;position:relative;box-shadow:0 5px 14px -4px rgba(17,26,46,.45)}
.mc.today{box-shadow:0 0 0 2px var(--amber)}
.rv.in .mc{animation:fadein .45s both;animation-delay:calc(var(--r)*45ms + var(--k)*20ms + 150ms)}
.cellinfo{margin-top:12px;font-size:12.5px;color:var(--muted);background:#F6F8FC;border:1px solid var(--line);
 border-radius:11px;padding:10px 14px;min-height:40px;display:flex;align-items:center;transition:.3s var(--e)}
.cellinfo.lit{animation:popin .3s var(--sp);color:var(--ink);border-color:#C9D4F8;background:var(--brand-soft)}

/* بطاقات الطلاب */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.scard{position:relative;overflow:hidden;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);padding:17px;box-shadow:var(--s1);transition:transform .4s var(--sp),box-shadow .4s var(--e)}
.scard::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gc);transform:scaleY(0);
 transform-origin:bottom;transition:transform .45s var(--sp)}
.scard:hover{transform:translateY(-5px);box-shadow:var(--s2)}
.scard:hover::after{transform:scaleY(1)}
.shead{display:flex;align-items:center;gap:11px}
.avatar{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;
 font-family:"Zain",sans-serif;font-weight:800;font-size:19px;background:linear-gradient(145deg,var(--gc),#164F42);
 transition:.4s var(--sp)}
.scard:hover .avatar{transform:rotate(-5deg) scale(1.06)}
.nmx{flex:1;min-width:0}
.nmx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmx span{font-size:12px;color:var(--muted)}
.rw{position:relative;width:46px;height:46px;flex:none}
.rlet{width:46px;height:46px;transform:rotate(-90deg)}
.rlet circle{fill:none;stroke-width:5;stroke-linecap:round}
.rlet .t{stroke:#E7EBF2}
.rlet .a{transition:stroke-dashoffset 1.1s var(--e)}
.rw b{position:absolute;inset:0;display:grid;place-content:center;font-family:"IBM Plex Mono",monospace;
 font-size:11.5px;font-weight:600;color:var(--gc)}
.mini{width:100%;height:44px;display:block;margin-top:13px}
.mini rect{transform-box:fill-box;transform-origin:bottom}
.rv.in .mini rect{animation:grow .55s var(--sp) both;animation-delay:calc(var(--j)*55ms + 250ms)}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;padding-top:11px;
 border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* مؤشرات */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:15px;
 padding:15px 17px;box-shadow:var(--s1);transition:.35s var(--e)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--s2)}
.stat::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--sc,var(--brand));
 transform:scaleX(0);transform-origin:right}
.stat.rv.in::after{animation:barin .9s var(--e) forwards;animation-delay:calc(var(--i)*90ms + 260ms)}
@keyframes barin{to{transform:scaleX(1)}}
.stat .lab{font-size:12px;color:var(--muted)}
.stat .val{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;line-height:1.3;color:var(--sc,var(--ink))}
.stat .val small{font-family:"IBM Plex Sans Arabic";font-size:12.5px;color:var(--muted);font-weight:400}

/* جدول المتصدرين */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:600;font-size:12px;color:var(--muted);padding:0 10px 11px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .25s}
tbody tr:hover{background:#F7F9FC}
.rank{font-family:"IBM Plex Mono",monospace;color:var(--muted);width:36px;font-size:15px}
.rank.top{color:var(--amber);font-weight:700;font-size:17px}
.me-row{background:linear-gradient(90deg,var(--brand-soft),transparent 70%)!important}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
 padding:7px 16px;font-size:13px;transition:.28s var(--e);position:relative;overflow:hidden}
.filter:hover{border-color:var(--brand);color:var(--brand)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* نوافذ */
.ov{position:fixed;inset:0;background:rgba(17,26,46,.45);backdrop-filter:blur(3px);display:flex;
 align-items:flex-start;justify-content:center;padding:18px;z-index:50;overflow-y:auto;
 overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:fadein .28s}
.modal{position:relative;background:var(--surface);border-radius:20px;width:100%;max-width:430px;padding:24px 24px 0;
 margin:auto;box-shadow:var(--s3);animation:popin .48s var(--sp);max-height:calc(100dvh - 36px);
 overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.modal::-webkit-scrollbar{width:6px}.modal::-webkit-scrollbar-thumb{background:#CBD3E0;border-radius:99px}
.modal h3{margin:0 0 3px;font-size:23px;position:sticky;top:-24px;background:var(--surface);padding:4px 0 2px;z-index:2}
.modal .sub{color:var(--muted);font-size:13px;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--muted);margin:15px 0 6px}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:12px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--ink);transition:.25s}
textarea{resize:vertical;line-height:1.8}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.row{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:0;z-index:2;background:var(--surface);padding:14px 0 20px}
.row::before{content:"";position:absolute;inset:auto 0 100% 0;height:22px;pointer-events:none;
 background:linear-gradient(transparent,var(--surface))}
.row .btn{flex:1}
.segv{display:flex;flex-direction:column;gap:7px}
.segv button{text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;transition:.28s var(--e)}
.segv button b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.segv button span{font-size:11.5px;color:var(--muted)}
.segv button:hover{border-color:#B9C5F3;transform:translateX(-3px)}
.segv button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.segv button[aria-pressed="true"] b{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:14px}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:13.5px;margin-bottom:12px;transition:.25s}
.back:hover{color:var(--ink);transform:translateX(-3px)}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;
 padding:12px 22px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--s3);animation:tin .5s var(--sp)}
@keyframes tin{from{opacity:0;transform:translate(50%,26px)}to{opacity:1;transform:translate(50%,0)}}
.alert{display:flex;align-items:center;gap:11px;background:#FCF1F4;border:1px solid #F1D6DE;color:#7E2140;
 border-radius:15px;padding:13px 16px;margin-bottom:15px;font-size:13.5px}
.alert svg{width:19px;height:19px;fill:none;stroke:var(--rose);stroke-width:1.8;flex:none}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
@media(max-width:760px){.g2{grid-template-columns:1fr}.wc{flex-direction:column}.cov,.cov svg{width:74px}
 .ringbox,.ring{width:120px;height:120px}.matrix{min-width:520px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ════════ هوية «خطوة» ════════ */
body{background:var(--bg)}
h1,h2,h3{font-family:"Zain",sans-serif}
.card,.wc,.ben,.scard,.stat,.sug,.pickbar,.tlog,.modal,.dg,.pad button,.filter,.qbtn{background:var(--card)}
.card,.wc,.ben,.scard{border-color:var(--line)}
.wordmark{font-family:"Zain",sans-serif;font-size:44px;font-weight:800;line-height:1;color:var(--teal);margin:14px 0 0}
.brandsub{margin:-2px 0 22px;color:var(--muted);font-family:"IBM Plex Sans Arabic",sans-serif;
 font-size:12.5px;font-weight:400;letter-spacing:0}
.brand-mark{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;margin:0 auto;
 background:var(--teal);color:#fff;font-family:"Reem Kufi",sans-serif;font-size:23px;font-weight:600;
 box-shadow:0 12px 24px rgba(22,79,66,.18)}
.brand-mark.sm{width:34px;height:34px;border-radius:12px;font-size:16px;margin:0;
 background:rgba(255,255,255,.14);box-shadow:none}
.bwrap em{color:#9CB2A9}
/* الشريط والعناصر البطولية */
.top{background:linear-gradient(138deg,#103C32 0%,#175548 62%,#216859 100%)}
.hero{background:linear-gradient(138deg,#103C32 0%,#175548 62%,#216859 100%);
 box-shadow:0 24px 48px -34px rgba(16,60,50,.75)}
.hero::before,.hero::after{display:none}      /* لا حركة مستمرة */
.blob,.pulse{display:none!important}
.hst .hv.am{color:#D9B872}.hst .hv.gr{color:#95C6B5}
/* أزرار */
.btn{background:var(--teal);box-shadow:0 10px 22px -14px rgba(22,79,66,.7);border-radius:14px;
 font-family:"Zain",sans-serif;font-weight:700;min-height:48px}
.btn:hover{background:var(--teal2);transform:none;box-shadow:0 12px 26px -14px rgba(22,79,66,.75)}
.btn:active{transform:scale(.99)}
.btn.sm{min-height:40px}
.btn.outline{color:var(--teal);border-color:var(--line-strong);background:transparent}
.btn.outline:hover{background:var(--teal-soft);border-color:var(--teal3)}
.filter[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.filter:hover{border-color:var(--teal3);color:var(--teal)}
.qbtn:hover{border-color:var(--teal3);color:var(--teal)}
.qbtn.del:hover{border-color:var(--danger);color:var(--danger)}
.tind{background:var(--teal)}
.dg.f{border-color:var(--teal);color:var(--teal);box-shadow:0 8px 18px -12px rgba(22,79,66,.6)}
.dg.a{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.pad button:hover{background:var(--teal-soft);border-color:var(--teal3)}
.hint code{background:var(--teal-soft);color:var(--teal)}
.hint code:hover{background:var(--teal);color:#fff}
/* بيانات */
.bar i{background:var(--teal)}
.bar{background:#EAEAE2}
.stat::after{background:var(--sc,var(--teal))}
.rank.top{color:var(--gold)}
.me-row{background:linear-gradient(90deg,var(--teal-soft),transparent 70%)!important}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.mid{background:var(--gold-soft);color:#8A6A28}
.pill.off{background:var(--danger-soft);color:var(--danger)}
.alert{background:var(--danger-soft);border-color:#EEDAD6;color:#7C3A33}
.alert svg{stroke:var(--danger)}
.sug{background:linear-gradient(120deg,var(--teal-soft),var(--card) 72%);border-color:#CFE0D8}
.sug.late{background:linear-gradient(120deg,var(--gold-soft),var(--card) 72%);border-color:#E8DCBE}
.sug.done{background:linear-gradient(120deg,#E4F0EA,var(--card) 72%);border-color:#C3DBD0}
.golink{background:var(--teal-soft);border-color:#CFE0D8;color:var(--teal)}
.golink:hover{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 10px 22px -14px rgba(22,79,66,.7)}
.golink .pl{background:var(--teal)}
.golink:hover .pl{background:rgba(255,255,255,.2)}
.nolink{color:var(--danger)}
/* الفوائد */
.star:hover,.star.on{color:var(--gold)}
.ben.picked{border-color:#E6D6AF;background:linear-gradient(150deg,var(--gold-soft),var(--card) 62%)}
.ben.picked::before{background:var(--gold)}
.ribbon{background:var(--gold)}
.pickbar{background:linear-gradient(120deg,var(--gold-soft),var(--card) 72%);border-color:#E8DCBE}
.pickbar .si{color:var(--gold)}
.quote{opacity:.09}
.cellinfo.lit{background:var(--teal-soft);border-color:#CFE0D8}
.avatar,.mn .av{background:var(--gc,var(--teal))}
/* حركة هادئة: عند الظهور والضغط فقط */
.anim .rv.in{animation-duration:.42s}
.day:hover,.ben:hover,.scard:hover,.wc:hover{transform:translateY(-2px)}
.star:hover{transform:scale(1.12)}
.golink:hover{transform:none}
.golink:hover .arw{transform:translate(-2px,-2px)}
@media(max-width:760px){
 .btn{min-height:50px}
 /* الجداول تتحول لبطاقات */
 .board table,.board thead,.board tbody,.board tr,.board td{display:block;width:100%}
 .board thead{display:none}
 .board table{min-width:0!important}
 .board tr{border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:11px;
  background:var(--card);box-shadow:var(--s1);position:relative}
 .board td{border:0;padding:5px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
 .board td::before{content:attr(data-l);color:var(--muted);font-size:12px}
 .board td.tdname{font-family:"Zain",sans-serif;font-weight:700;font-size:17px;padding-top:0}
 .board td.rank{position:absolute;left:15px;top:13px;padding:0;width:auto}
 .board td.rank::before{content:"#";margin-left:2px}
}

/* ════════ صقل بصري ════════ */
:root{--sp1:8px;--sp2:14px;--sp3:22px;--sp4:32px}
body{font-size:15.5px;line-height:1.8;letter-spacing:0}
h1{letter-spacing:-.01em}
h2{font-size:clamp(22px,3vw,28px);letter-spacing:-.005em}
.eyebrow{font-size:11px;font-weight:500;text-transform:none;opacity:.9}

/* عنوان القسم بخط ذهبي رفيع */
.sec h2{position:relative;padding-right:15px}
.sec h2::before{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);
 width:4px;height:20px;border-radius:4px;background:var(--gold);opacity:.85}

/* بطاقات أنعم وأعمق */
.card,.wc,.ben,.scard,.shcard{border-radius:22px}
.card{padding:23px}
.card:hover,.ben:hover,.scard:hover,.wc:hover{box-shadow:0 4px 10px rgba(22,79,66,.05),0 22px 44px -32px rgba(22,79,66,.5)}
.stat{border-radius:18px}
.stat .val{font-size:32px;letter-spacing:-.02em}
.stat .lab{font-size:11.5px}

/* اللوحة البطولية: خط ذهبي فاصل وتنفّس أوسع */
.hero{padding:28px 28px 24px;border-radius:26px}
.hero h2{font-size:clamp(23px,3.4vw,31px);margin-top:2px}
.hlab{letter-spacing:.02em}
.hst{gap:28px;margin-top:4px}
.hst .hv{font-size:33px;letter-spacing:-.02em}
.hero .track{margin-top:20px;padding-top:18px;border-top:1px solid rgba(217,184,114,.22)}

/* أيام الأسبوع */
.day{border-radius:14px;padding:11px 4px 10px;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.07)}
.day:hover{background:rgba(255,255,255,.13)}
.day.today{border-color:#D9B872;background:rgba(217,184,114,.14);box-shadow:none}
.day.full .dv{color:#A9D6C4}
.day .chk{font-size:15px}
.day .dn{letter-spacing:.02em;font-size:10px}
.day .dv{font-size:14px;margin-top:4px}
.day .fill i{background:#A9D6C4}
.day.today .fill i{background:#D9B872}

/* تبويبات: أوضح وألمس */
.tabs{gap:4px;margin:26px 0 24px}
.tabs button{padding:12px 15px;border-radius:12px 12px 0 0}
.tabs button[aria-selected="true"]{background:linear-gradient(var(--teal-soft),transparent)}
.tind{height:3px;border-radius:3px}

/* أزرار: ضغطة محسوسة */

.btn:active{transform:scale(.985)}
.btn.sm{border-radius:12px}
.filter{border-radius:999px;padding:8px 17px}
.filter[aria-pressed="true"]{box-shadow:0 8px 18px -12px rgba(22,79,66,.8)}

/* الحلقة */
.ring .tr{stroke:#EAEAE2}
.rmid b{letter-spacing:-.02em}

/* مقرر الأسبوع: غلاف بحافة كتاب */

.mn .av{border-radius:10px}
.cellinfo{border-radius:13px}

.wstrip::-webkit-scrollbar{display:none}
.wk{flex:none;width:78px;text-align:center;background:var(--bg-soft);border:1px solid var(--line);
 border-radius:16px;padding:11px 6px 9px;position:relative;transition:.3s var(--e)}
.wk:hover{border-color:var(--teal3);transform:translateY(-2px)}
.wk.done{background:var(--teal-soft);border-color:#CFE0D8}
.wk svg{width:44px;height:44px;display:block;margin:0 auto}

.tent.off{opacity:.55}

/* ════════ اللوحة البطولية ════════ */
.hero-week{position:relative;overflow:hidden}
.hglow{position:absolute;inset:auto -60px -140px auto;width:320px;height:320px;border-radius:50%;
 background:radial-gradient(circle,rgba(217,184,114,.22),transparent 62%);pointer-events:none}
.rv.in .hglow{animation:glowin 1s var(--e) both}
@keyframes glowin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.hpill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);
 border:1px solid rgba(217,184,114,.28);color:#D9B872;border-radius:999px;padding:4px 13px;font-size:11.5px}
.hdot{width:6px;height:6px;border-radius:50%;background:#D9B872;display:inline-block}
.rv.in .hdot{animation:dotin .5s var(--sp) .2s both}
@keyframes dotin{from{transform:scale(0)}to{transform:scale(1)}}
.hgreet h2{margin-top:9px}
.rv.in .hgreet h2{animation:up .55s var(--e) .06s both}
.rv.in .hgreet .hsub{animation:up .55s var(--e) .16s both}
.rv.in .hst>div:nth-child(1){animation:up .5s var(--e) .18s both}
.rv.in .hst>div:nth-child(2){animation:up .5s var(--e) .26s both}
.rv.in .hst>div:nth-child(3){animation:up .5s var(--e) .34s both}
.rv.in .hst>div:nth-child(4){animation:up .5s var(--e) .42s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hsub{margin:6px 0 0;font-size:13px;color:#9CB2A9;max-width:420px;line-height:1.8}

/* خط المسار */
.wline{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.12);
 margin-top:20px;overflow:visible}
.wline i{display:block;height:100%;width:0;border-radius:99px;
 background:linear-gradient(90deg,#3D8F79,#D9B872);transition:width 1.1s var(--e)}
.wline .pace{position:absolute;top:-5px;width:2px;height:18px;background:rgba(255,255,255,.55);border-radius:2px}
.wline .pace em{position:absolute;top:-19px;right:-16px;font-style:normal;font-size:9.5px;color:#9CB2A9;white-space:nowrap}

/* أيام الأسبوع تتصاعد بالتتابع */
.rv.in .day{animation:dayin .5s var(--sp) both;animation-delay:calc(var(--k,0)*55ms + .25s)}
@keyframes dayin{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

/* ════════ سجلي: يومًا بيوم ════════ */
.dlist{display:flex;flex-direction:column;gap:9px}
.wkhead{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
.wkt{font-family:"Zain",sans-serif;font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap}
.wkl{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.drow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
 border-radius:16px;padding:12px 15px;box-shadow:var(--s1);transition:.3s var(--e)}
.drow:hover{border-color:var(--teal3);transform:translateX(-3px)}
.dbadge{width:50px;flex:none;text-align:center;background:var(--bg-soft);border:1px solid var(--line);
 border-radius:12px;padding:6px 2px;transition:.3s var(--e)}
.dbadge b{display:block;font-family:"Zain",sans-serif;font-size:12px;font-weight:700;color:var(--ink2)}
.dbadge i{font-style:normal;font-size:11px;color:var(--muted)}
.dbadge.full{background:var(--teal-soft);border-color:#CFE0D8}
.dbadge.full b{color:var(--teal)}
.dbody{flex:1;min-width:0}
.dvals{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dv2 .num{color:var(--teal);font-weight:600;font-size:14px}
.dv2.gold .num{color:var(--gold)}
.dbar{display:block;height:5px;border-radius:99px;background:#EAEAE2;overflow:hidden;margin-top:8px}
.dbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--teal);transition:width .8s var(--e)}
.dpct{flex:none;width:44px;text-align:left;font-size:12.5px;color:var(--muted)}
@media(max-width:760px){.dpct{display:none}.drow{padding:11px 13px;gap:11px}}

/* ════════ مقياس الأسبوع: حركة تشرح لا تزيّن ════════ */
.wmeter{display:flex;align-items:center;gap:10px;margin-top:22px}
.wm-lab{font-size:10px;color:#7E948B;white-space:nowrap}
.wm-track{position:relative;flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.13)}
.wm-track i{display:block;height:100%;width:0;border-radius:99px;
 background:linear-gradient(90deg,#3D8F79,#95C6B5);transition:width 1.2s var(--e)}
.wm-now{position:absolute;top:-6px;width:2px;height:21px;background:#D9B872;border-radius:2px}
.wm-now em{position:absolute;top:-18px;right:-27px;font-style:normal;font-size:9.5px;color:#D9B872;white-space:nowrap}
.rv.in .wm-now{animation:tick .5s var(--sp) .9s both}
@keyframes tick{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}

/* ════════ بطاقة مقدار اليوم ════════ */
.quota{background:var(--card);border:1.5px solid #CFE0D8;border-radius:20px;padding:18px 19px 15px;
 margin-top:15px;box-shadow:var(--s1)}
.quota.late{border-color:#E8DCBE;background:linear-gradient(150deg,var(--gold-soft),var(--card) 62%)}
.quota.ok,.quota.done{border-color:#BFDCCF;background:linear-gradient(150deg,var(--teal-soft),var(--card) 62%)}
.qhead{display:flex;align-items:flex-start;gap:14px}
.qi{width:46px;height:46px;border-radius:15px;background:var(--bg-soft);border:1px solid var(--line);
 display:grid;place-items:center;font-size:21px;flex:none}
.quota.ok .qi,.quota.done .qi{background:#fff;border-color:#CFE0D8}
.qhead b{font-family:"Zain",sans-serif;font-size:17px;font-weight:700;display:block;color:var(--ink)}
.qhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.8}
.qrows{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.qrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.qlab{width:44px;flex:none;font-size:12.5px;color:var(--muted)}
.qbar{flex:1;height:9px;border-radius:99px;background:#EAEAE2;overflow:hidden}
.qbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--teal);transition:width 1s var(--e)}
.qrow.g .qbar i{background:var(--gold)}
.qrow.ok .qbar i{background:var(--teal2)}
.qnum{flex:none;width:96px;text-align:left;font-size:12.5px;color:var(--muted)}
.qnum b{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink)}
.qrow.ok .qnum b{font-family:"IBM Plex Sans Arabic";color:var(--teal);font-size:13px}
.qfoot{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.qfoot .num{color:var(--ink);font-weight:600}
.ctag{background:var(--gold-soft);color:#8A6A28;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
@media(max-width:760px){.qnum{width:78px;font-size:11.5px}.qlab{width:38px}}

/* ════════ نظرة عامة ════════ */
.todo{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px 19px;
 margin-top:15px;box-shadow:var(--s1)}
.tdh{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tdh b{font-family:"Zain",sans-serif;font-size:17px;font-weight:700}
.tdi{width:26px;height:26px;border-radius:9px;background:var(--danger-soft);color:var(--danger);
 display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.tditem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #F1F2EC}
.tditem:last-child{border-bottom:0}
.tdd{width:8px;height:8px;border-radius:50%;flex:none}
.tditem.red .tdd{background:var(--danger)}
.tditem.amber .tdd{background:var(--gold)}
.tdt{flex:1;min-width:0}
.tdt b{display:block;font-size:14.5px;font-weight:600}
.tdt span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allgood{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--teal-soft),var(--card) 70%);
 border:1.5px solid #CFE0D8;border-radius:20px;padding:16px 19px;margin-top:15px}
.allgood>span{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;
 color:var(--teal);font-size:20px;flex:none}
.allgood b{font-family:"Zain",sans-serif;font-size:16px;font-weight:700;display:block}
.allgood p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

.gcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
 box-shadow:var(--s1);position:relative;overflow:hidden;transition:.35s var(--e)}
.gcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gc)}
.gcard:hover{box-shadow:var(--s2);transform:translateY(-2px)}
.gch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gch h3{font-size:20px;margin-top:2px}
.gbig{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;line-height:1;text-align:left}
.gbig small{display:block;font-family:"IBM Plex Sans Arabic";font-size:11px;font-weight:400;margin-top:3px}
.gmeta{display:flex;gap:16px;margin-top:11px;font-size:12.5px;color:var(--muted)}
.gmeta b{color:var(--ink)}
.gmeta .warn{color:var(--danger)}
.gmeta .warn b{color:var(--danger)}
.gplan{display:flex;flex-direction:column;gap:6px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.pchip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .num{color:var(--ink)}
.pchip.red{color:var(--danger);font-weight:600}
.gopen{width:100%;margin-top:13px;border:1px solid var(--line);background:var(--bg-soft);border-radius:12px;
 padding:10px;font-size:13px;color:var(--teal);transition:.28s var(--e);font-family:"Zain",sans-serif;font-weight:700}
.gopen:hover{background:var(--teal-soft);border-color:var(--teal3);transform:translateY(-2px)}

.trow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid #F1F2EC;
 cursor:pointer;transition:.25s var(--e);border-radius:10px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--bg-soft);padding-inline:9px}
.tnum{width:22px;flex:none;font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:14px}
.tnum.top{color:var(--gold);font-weight:700}
.tname{flex:1;min-width:0}
.tname b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname span{font-size:11.5px;color:var(--muted)}
.tbar{width:64px;flex:none;height:6px;border-radius:99px;background:#EAEAE2;overflow:hidden}
.tbar i{display:block;height:100%;width:0;border-radius:99px;transition:width .9s var(--e)}
.tpct{width:38px;text-align:left;font-size:12px;color:var(--muted);flex:none}
@media(max-width:760px){.tbar{display:none}}

/* ════════ منحنى النبض ════════ */
.sparkwrap{margin-top:20px}
.spark{width:100%;height:104px;display:block;overflow:visible}
.spark .sline{fill:none;stroke:#95C6B5;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rv.in .spark .sline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s var(--e) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark .sarea{opacity:0}
.rv.in .spark .sarea{animation:fadein .8s var(--e) .9s forwards}
.spark .sdot{fill:#fff;opacity:0}
.rv.in .spark .sdot{animation:popin .45s var(--sp) 1.35s forwards}
.sfoot{display:flex;justify-content:space-between;font-size:10px;color:#7E948B;margin-top:2px}

/* ════════ أشرطة التنبيه ════════ */
.bar-alert{display:flex;align-items:center;gap:12px;border-radius:16px;padding:13px 16px;margin-top:12px;font-size:13.5px}
.bar-alert svg{width:19px;height:19px;fill:none;stroke-width:1.8;flex:none}
.bar-alert span:not(.ai){flex:1;min-width:0}
.bar-alert .ai{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:none}
.bar-alert.red{background:var(--danger-soft);border:1px solid #EEDAD6;color:#7C3A33}
.bar-alert.red svg{stroke:var(--danger)}
.bar-alert.gold{background:var(--gold-soft);border:1px solid #E8DCBE;color:#7A5A11}
.bar-alert.gold .ai{background:#fff;color:var(--gold)}
.bar-alert.ok{background:var(--teal-soft);border:1px solid #CFE0D8;color:var(--teal)}
.bar-alert.ok .ai{background:#fff;color:var(--teal)}
.bar-alert .btn{flex:none}

/* ════════ مقارنة الصفوف ════════ */
.cmp{display:grid;grid-template-columns:1fr 2.2fr auto;grid-template-areas:"h b v" "m m m";
 align-items:center;gap:10px 14px;padding:14px 0;border-bottom:1px solid #F1F2EC}
.cmp:last-of-type{border-bottom:0}
.cmp-h{grid-area:h;min-width:0}
.cmp-h b{display:block;font-size:15px;font-weight:600}
.cmp-h span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cmp-b{grid-area:b;height:26px;border-radius:9px;background:#EFF1EC;overflow:hidden}
.cmp-b i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s var(--e)}
.cmp-v{grid-area:v;font-size:17px;font-weight:600;width:48px;text-align:left;color:var(--ink)}
.cmp-m{grid-area:m;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cmp-m .num{color:var(--ink)}
.lnk2{margin-right:auto;background:none;border:0;color:var(--teal);font-size:12.5px;padding:2px 4px;
 border-radius:7px;transition:.25s}
.lnk2:hover{background:var(--teal-soft)}
.cmp-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;
 border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.cmp-foot b{color:var(--ink)}
.lg{width:10px;height:10px;border-radius:3px;background:var(--teal);display:inline-block;margin-left:5px}

/* ════════ زر العودة للأعلى ════════ */
.fab{position:fixed;bottom:20px;right:50%;transform:translate(50%,20px);opacity:0;pointer-events:none;
 width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);
 color:var(--teal);font-size:19px;box-shadow:var(--s2);transition:.3s var(--e);z-index:40}
.fab.on{opacity:1;transform:translate(50%,0);pointer-events:auto}
.fab:hover{background:var(--teal-soft);border-color:var(--teal3)}
@media(max-width:760px){.cmp{grid-template-columns:1fr auto;grid-template-areas:"h v" "b b" "m m"}
 .cmp-b{height:22px}}

/* ════════ البطاقة الموحّدة ════════ */
.quota{padding:20px 20px 18px}
.qhead{align-items:center}
.qring{position:relative;width:74px;height:74px;flex:none}
.qring svg{width:74px;height:74px;display:block}
.qring circle{transition:stroke-dashoffset 1.1s var(--e)}
.qring b{position:absolute;inset:0;display:grid;place-content:center;padding-bottom:11px;
 font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink)}
.qring em{position:absolute;inset:auto 0 15px 0;text-align:center;font-style:normal;font-size:9px;color:var(--muted)}
.quota .btn{min-height:50px}
.qhintx{margin:13px 0 0;font-size:12px;color:var(--muted);text-align:center;
 border-top:1px dashed var(--line);padding-top:13px}
.quota .tlog{margin-top:15px}
@media(max-width:760px){
 .qhead{flex-wrap:wrap}
 .qring{width:60px;height:60px;order:-1;margin-inline-start:auto}
 .qring svg{width:60px;height:60px}
 .qring b{font-size:13px;padding-bottom:9px}
 .qring em{font-size:8px;bottom:11px}
}

/* ════════ توزيع الخطوط وفق دليل هوية «خطوة» ════════ */
/* Zain: العناوين وعناوين الأقسام فقط */
h1,h2,h3{font-family:"Zain",sans-serif;font-weight:800}
h3{font-weight:700}

/* IBM Plex Sans Arabic: كل النصوص والأزرار والحقول والقوائم */
.btn,.golink,.gopen,.filter,.startbtn,.qbtn,.movebtn,.lnk2,.ghost,.tabs button,
input,select,textarea,label,.chip,.pill{font-family:"IBM Plex Sans Arabic",sans-serif}
.btn{font-weight:600;letter-spacing:0}
.golink,.gopen{font-weight:600}

/* التسميات العريضة الصغيرة: Plex بوزن ٦٠٠ لا Zain */
.qhead b,.sug b,.pickbar b,.empty b,.wkt,.dbadge b,.tdh b,.allgood b,.goalwin b,
.cmp-h b,.tdt b,.nmx b,.nm b,.tname b,.bn b,.lninfo b{
 font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600}
.empty b{font-weight:700;font-size:17px}
.wkt{font-weight:600}
.board td.tdname{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600;font-size:16px}

/* Reem Kufi: الشعار وحرف الحساب فقط */
.wordmark,.brand{font-family:"Reem Kufi",sans-serif;font-weight:600}
.wordmark{font-size:42px;letter-spacing:0}
.brand{font-weight:600;font-size:22px}
.brandsub{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:12.5px;
 color:var(--muted);letter-spacing:.06em}
.avatar,.mn .av,.gstud .gav,.fchip .fav{font-family:"Reem Kufi",sans-serif;font-weight:600}
.brand-mark{font-family:"Reem Kufi",sans-serif;font-weight:600}

/* IBM Plex Mono: الأرقام فقط */
.num,.hst .hv,.stat .val,.rmid b,.qring b,.rank,.dg,.pad button,.hint code,
.gbig,.cmp-v,.prow b,.qnum b,.wk b,.dbadge i{font-family:"IBM Plex Mono",monospace}
.hst .hv small,.stat .val small,.gbig small{font-family:"IBM Plex Sans Arabic",sans-serif}

/* اقتباس الفائدة: نص عادي مقروء */
.ben.big .btxt{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:400;line-height:2.1}
.quote{font-family:"Zain",sans-serif;font-weight:800}

.prof{background:linear-gradient(120deg,var(--teal-soft),var(--card) 68%);border-color:#CFE0D8}
.codebox2{font-family:"IBM Plex Mono",monospace;font-size:13.5px;letter-spacing:.18em;color:var(--teal);
 background:var(--teal-soft);border-radius:8px;padding:3px 10px;display:inline-block;direction:ltr}
.supcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.supcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;
 box-shadow:var(--s1);position:relative;overflow:hidden;transition:.35s var(--e)}
.supcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gc)}
.supcard:hover{box-shadow:var(--s2);transform:translateY(-2px)}
.sup-h{display:flex;align-items:center;gap:11px}
.sup-b{display:flex;align-items:center;gap:18px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);flex-wrap:wrap}
.sup-b>div{display:flex;flex-direction:column;gap:3px}
.k2{font-size:11px;color:var(--muted)}
.sup-b b{font-size:17px}

/* ════════ المتصدرون ════════ */
.bwrap2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg2{display:flex;background:#E9EBE4;border-radius:999px;padding:4px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-size:13px;
 color:var(--muted);transition:.28s var(--e);white-space:nowrap;
 font-family:"IBM Plex Sans Arabic",sans-serif}
.seg2 button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--s1)}
.seg2 button:hover:not(.on){color:var(--ink2)}
.board2{padding-bottom:16px}
.b2h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.b2s{display:flex;gap:14px;font-size:12px;color:var(--muted);text-align:left}
.b2s b{color:var(--ink);font-size:15px;display:block}
.myrank{display:flex;align-items:center;gap:9px;background:var(--teal-soft);border:1px solid #CFE0D8;
 border-radius:14px;padding:11px 15px;margin-top:14px;font-size:12.5px;color:var(--teal)}
.myrank b{font-size:19px;color:var(--teal)}
.sep2{width:1px;height:20px;background:#BFD7CC;margin:0 4px}
.blist{margin-top:14px;display:flex;flex-direction:column;gap:6px}

function pulseSeries(n){
 const all=activeStudents(),out=[];
 for(let k=n-1;k>=0;k--){const d=dayISO(k);let sum=0,c=0;
  for(const s of all){const t=targetAt(s,weekStart(d)),per=(t.r+t.l)/7;
   if(!per)continue;const x=dayOf(s.code,d);
   sum+=Math.min(100,(x.r+x.l)/per*100);c++}
  out.push({d,v:c?Math.round(sum/c):0})}
 return out}
function sparkline(n){
 const pts=pulseSeries(n||14),W=1000,H=104;
 const xs=(i)=>W-(W/(pts.length-1))*(pts.length-1-i);
 const ys=(v)=>H-14-(H-34)*(v/100);
 const P=pts.map((p,i)=>({x:xs(i),y:ys(p.v)}));
 const path=P.map((p,i)=>{if(!i)return `M${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  const q=P[i-1],cx=(q.x+p.x)/2;
  return `C${cx.toFixed(1)},${q.y.toFixed(1)} ${cx.toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ');
 const last=P[P.length-1];
 return `<div class="sparkwrap">
  <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="نبض آخر ${pts.length} يومًا">
   <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#95C6B5" stop-opacity=".38"/><stop offset="1" stop-color="#95C6B5" stop-opacity="0"/></linearGradient></defs>
   <path class="sarea" d="${path} L${W},${H} L0,${H} Z" fill="url(#sg)"></path>
   <path class="sline" pathLength="1" d="${path}"></path>
   <circle class="sdot" cx="${last.x-4}" cy="${last.y}" r="5"></circle></svg>
  <div class="sfoot"><span>قبل ${pts.length} يومًا</span><span>اليوم</span></div></div>`}

function overview(){
 const ws=WS(),all=activeStudents(),lw=addD(ws,-7);
 const avg=all.length?Math.round(all.reduce((t,s)=>t+weekPct(s),0)/all.length):0;
 const lastV=all.map(s=>pctAt(s,lw)).filter(x=>x!==null);
 const lastAvg=lastV.length?Math.round(lastV.reduce((a,b)=>a+b,0)/lastV.length):null;

function openLog(){const p=planOf(S.me.grade,WS());
 if(!p.read&&!p.listen)return toast('ما تحدد مقرر لصفك هذا الأسبوع — راجع مشرفك.');
 S.modal={t:'log',kind:p.read?'read':'listen'};renderModal()}
function openEdit(id){S.modal={t:'edit',id};renderModal()}
function openPlan(g,ws){ws=ws||WS();const p=planOf(g,ws);
 S.modal={t:'plan',g,ws,hasR:!!p.read,hasL:!!p.listen};renderModal()}
function openAdd(){S.modal={t:'add',g:GRADES[0].id};renderModal()}
function openSeries(g){S.modal={t:'ser',g:g||GRADES[0].id,kind:'read',
 sw:weekStart(todayISO()),n:6};renderModal()}
function keepSer(){const q=i=>$(i);['st','sb','sn2','stot','slink'].forEach(i=>{
 if(q(i))S.modal[i+'_']=q(i).value});
 if(q('ssw'))S.modal.sw=q('ssw').value; if(q('sn'))S.modal.n=+q('sn').value||6}
async function saveSeries(){const m=S.modal;
 const title=($('st').value||'').trim(); if(!title){$('st').focus();return toast('اكتب اسم المقرر.')}
 const total=Math.max(1,+$('stot').value||0);
 if(!total){$('stot').focus();return toast('أدخل الحجم الكلي.')}
 const n=Math.max(1,Math.min(30,+$('sn').value||1));
 const link=m.kind==='listen'?($('slink').value||'').trim():null;
 if(m.kind==='listen'&&!/^https:\/\//i.test(link||'')){$('slink').focus();
  return toast('رابط المقطع مطلوب ويبدأ بـ https.')}
 setBusy(1);
 try{const r=await rpc('add_series',{p_token:TOKEN,p_grade:m.g,p_kind:m.kind,p_title:title,
   p_by:($('sb').value||'').trim(),p_note:($('sn2').value||'').trim(),
   p_total:total,p_weeks:n,p_start:$('ssw').value,p_link:link});
  S.modal=null;renderModal();await refresh();
  toast('وُزّع «'+title+'» على '+r.weeks+' أسابيع · '+r.per+' لكل أسبوع');
 }catch(e){toast(e.message)}finally{setBusy(0)}}
async function delSeries(sid,title){
 if(!confirm('حذف «'+title+'» من كل أسابيعه؟ إنجاز الطلاب المسجّل يبقى محفوظًا.'))return;
 setBusy(1);
 try{await rpc('delete_series',{p_token:TOKEN,p_sid:sid});await refresh();
  toast('حُذف المقرر من أسابيعه.');
 }catch(e){toast(e.message)}finally{setBusy(0)}}
function seriesOf(g){const map={};
 termWeeks().forEach(ws=>{const p=planOf(g,ws);
  [p.read,p.listen].forEach(c=>{if(c&&c.sid)map[c.sid]=map[c.sid]||{c,weeks:[]};
   if(c&&c.sid)map[c.sid].weeks.push(ws)})});
 return Object.values(map)}
function openTerm(){S.modal={t:'term',n:TERM.weeks,st:TERM.start||weekStart(todayISO())};renderModal()}
async function saveTerm(){const w=Math.max(1,Math.min(30,+$('tw').value||12)),st=$('tsw').value;
 setBusy(1);
 try{await rpc('set_term',{p_token:TOKEN,p_start:st,p_weeks:w});
  S.modal=null;renderModal();await refresh();toast('حُدّث الفصل: '+w+' أسابيع من '+st);
 }catch(e){toast(e.message)}finally{setBusy(0)}}
function codeTaken(c,exclude){return (STUDENTS.some(x=>x.code===c)
 ||SUPERVISORS.some(x=>x.code===c&&x.code!==exclude)||(ADMIN.code===c&&ADMIN.code!==exclude))}
function openSup(code){const v=code?supByCode(code):null;
 S.modal={t:'sup',code:code||'',g:v?v.grade:'',n_:v?v.name:'',c_:v?v.code:''};renderModal()}
async function saveSup(){const m=S.modal;
 const n=($('vn').value||'').trim();if(!n){$('vn').focus();return toast('اكتب اسم المشرف.')}
 const c=($('vc').value||'').trim();
 if(!/^[0-9]{4}$/.test(c)){$('vc').focus();return toast('الرمز أربعة أرقام.')}
 const g=$('vg').value;
 const holder=g?SUPERVISORS.find(x=>x.grade===g&&x.code!==m.code):null;
 if(holder&&!m.ok){S.modal.ok=1;S.modal.n_=n;S.modal.c_=c;S.modal.g=g;renderModal();
  return toast('لـ'+gradeById(g).name+' مشرف ('+holder.name+') — سيُنقل إلى «بلا صف». اضغط حفظ للتأكيد.')}
 setBusy(1);
 try{await rpc('upsert_supervisor',{p_token:TOKEN,p_old_code:m.code||null,p_name:n,p_code:c,p_grade:g});
  S.modal=null;renderModal();await refresh();
  toast(m.code?'حُدّثت بيانات '+n:'أُضيف '+n+' — رمزه '+c);
 }catch(e){toast(e.message)}finally{setBusy(0)}}
async function removeSup(code){const v=supByCode(code);
 if(!confirm('إزالة '+v.name+'؟ طلاب صفه يبقون بلا مشرف حتى تُسند غيره.'))return;
 setBusy(1);
 try{await rpc('delete_supervisor',{p_token:TOKEN,p_code:code});
  S.modal=null;renderModal();await refresh();toast('أُزيل '+v.name);
 }catch(e){toast(e.message)}finally{setBusy(0)}}
function openMe(){S.modal={t:'me',n_:S.me.name,c_:S.me.code};renderModal()}
async function saveMe(){const n=($('mn2').value||'').trim();
 if(!n){$('mn2').focus();return toast('اكتب اسمك.')}
 const c=($('mc2').value||'').trim();
 if(!/^[0-9]{4,8}$/.test(c)){$('mc2').focus();return toast('الرمز من ٤ إلى ٨ أرقام.')}

function countEl(el){if(el._c)return;el._c=1;
 const to=+el.dataset.to,sfx=el.dataset.suffix||'',dur=to>200?1000:780,t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
  el.textContent=Math.round(to*e)+sfx;if(k<1)requestAnimationFrame(step)};
 setTimeout(()=>requestAnimationFrame(step),110)}
let IO=null;
function observeReveals(anim){
 if(IO){IO.disconnect();IO=null}
 const nodes=[...document.querySelectorAll('main .rv')];
 if(!anim||reduced){nodes.forEach(n=>n.classList.add('in'));paintWithin(document,false);return}
 IO=new IntersectionObserver(es=>{es.forEach(x=>{if(!x.isIntersecting)return;
  x.target.classList.add('in');paintWithin(x.target,true);IO.unobserve(x.target)})},
  {rootMargin:'40px 0px -6% 0px',threshold:.04});
 nodes.forEach(n=>IO.observe(n));
 setTimeout(()=>paintWithin(document,false),2200)}
function moveTab(){const t=$('tabs');if(!t)return;
 const a=t.querySelector('[aria-selected="true"]'),ind=$('tind');if(!a||!ind)return;
 ind.style.width=a.offsetWidth+'px';ind.style.right=(t.scrollWidth-a.offsetLeft-a.offsetWidth)+'px'}
let lastKey='';
function renderShell(){
 if(!S.role)return drawLogin();
drawLogin();
 const key=[S.role,S.view,S.student].join('|'),anim=key!==lastKey;lastKey=key;
 let main='';
 if(S.role==='student')main=tabs([{id:'week',label:'أسبوعي'},{id:'ben',label:'فوائدي'},
   {id:'picks',label:'المنتخبات'},{id:'log',label:'سجلي'},{id:'board',label:'المتصدرون'}])
  +(S.view==='log'?myLogView():S.view==='ben'?myBenView():S.view==='picks'?picksView()
   :S.view==='board'?boardView():weekView());
 if(S.role==='supervisor')main=tabs([{id:'class',label:'صفّي'},{id:'ben',label:'فوائد طلابي'},
   {id:'picks',label:'المنتخبات'},{id:'board',label:'المتصدرون'}])
  +(S.student?detailView():S.view==='ben'?benView():S.view==='picks'?picksView()
   :S.view==='board'?boardView():classView());
 if(S.role==='admin')main=tabs([{id:'home',label:'نظرة عامة'},{id:'plan',label:'مقرر الأسبوع'},{id:'class',label:'المتابعة'},
   {id:'ben',label:'الفوائد'},{id:'picks',label:'المنتخبات'},{id:'people',label:'الطلاب'},{id:'board',label:'المتصدرون'}])
  +(S.student?detailView():S.view==='class'?classView():S.view==='ben'?benView()
   :S.view==='picks'?picksView():S.view==='people'?peopleView()
   :S.view==='board'?boardView():S.view==='plan'?planView():overview());
 shell().innerHTML=topbar()+`<main class="wrap ${anim?'anim':''}" style="padding-bottom:70px">${main}</main>`;
 requestAnimationFrame(()=>{moveTab();observeReveals(anim)})}
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.btn,.filter,.qbtn');if(!b||reduced)return;
 const r=b.getBoundingClientRect(),d=document.createElement('span');
 d.className='ripple';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
 d.style.width=d.style.height='18px';
 if(!b.classList.contains('btn')||b.classList.contains('outline'))d.style.background='rgba(47,75,216,.18)';
 b.appendChild(d);setTimeout(()=>d.remove(),560)},{passive:true});
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(moveTab,120)},{passive:true});
/* زر العودة للأعلى */
(function fab(){const b=document.createElement('button');
 b.className='fab';b.setAttribute('aria-label','العودة للأعلى');b.innerHTML='︿';
 b.onclick=()=>scrollTo({top:0,behavior:reduced?'auto':'smooth'});
 document.body.appendChild(b);let tick=false;
 addEventListener('scroll',()=>{if(tick)return;tick=true;
  requestAnimationFrame(()=>{b.classList.toggle('on',scrollY>420);tick=false})},{passive:true})})();
document.addEventListener('keydown',e=>{
 if(!S.role){if(/^[0-9]$/.test(e.key))tap(null,e.key);
  else if(e.key==='Backspace')tap(null,'back');else if(e.key==='Enter')login();return}
 if(e.key==='Escape')closeModal()});

/* ── الإقلاع: استعادة بيانات هذا الجهاز ثم عرض الدخول ── */
(async function start(){
 drawLogin();
 if(TOKEN){overlayMsg('جارٍ فتح حسابك…');
  try{await boot()}catch(e){forceLogout()}}
})();
